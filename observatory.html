<!doctype html>
<html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self' https://api.open-meteo.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="robots" content="noindex, nofollow, noimageindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#162a2c"><title>Chiang Mai Weather Atlas · 3D explorer</title><link rel="stylesheet" href="observatory/friends.css"><link rel="stylesheet" href="observatory/house-pin.css"></head>
<body class="explorer"><header class="mast"><a href="index.html">Chiang Mai <b>Weather Atlas</b></a><a href="index.html">Field guide ↗</a></header>
<main class="workspace"><section class="map-col" aria-label="Terrain and weather">
  <nav class="locations" aria-label="Map destinations"><button data-place="window" aria-pressed="true">Basin</button><button data-place="crag">Crazy Horse</button><button data-place="province">Province</button><button data-place="region">Southeast Asia</button><button data-place="global">Globe</button><button id="my-house">My house</button></nav>
  <div id="orbit"></div><div id="house-panel" hidden></div>
  <div class="timebox"><div class="weather-source"><label>Weather <select id="weather-source"><option value="live">Current forecast</option><option value="replay">Saved replay</option></select></label><button type="button" id="refresh-weather">Refresh forecast</button></div><p id="weather-status" role="status" aria-live="polite"></p><div class="timehead"><strong id="valid">Loading weather…</strong><span>Chiang Mai time · ICT</span></div>
  <div class="scrub"><button id="previous" aria-label="Previous hour">−1h</button><button id="play" aria-label="Play weather hours">Play</button><button id="next" aria-label="Next hour">+1h</button><input type="range" id="weather-hour" aria-label="Weather hour" min="0" max="0" value="0" disabled></div><div class="range-ends"><span id="from"></span><span id="to"></span></div></div>
</section><aside class="inspector">
  <h1>Explore the atlas</h1>
  <fieldset><legend>Map layers</legend><div class="switches">
    <label><input type="checkbox" id="cloud" checked>Clouds</label><label><input type="checkbox" id="wind" checked>Wind</label><label><input type="checkbox" id="localRain">Hourly rain</label><label><input type="checkbox" id="sunPath">Sun path</label><label><input type="checkbox" id="shadows">Shadows</label><label><input type="checkbox" id="roads">Roads</label><label><input type="checkbox" id="rivers">Rivers</label><label><input type="checkbox" id="labels" checked>Place labels</label>
  </div><label class="setting">Cloud height<select id="band"><option value="all">All bands</option><option value="low">Low</option><option value="mid">Middle</option><option value="high">High</option></select></label><label class="setting">Wind level<select id="level"><option>925</option><option selected>850</option><option>700</option><option>500</option><option>300</option></select> hPa</label><label class="setting">Drag mode<select id="gesture"><option value="orbit">Rotate</option><option value="pan">Move</option></select></label></fieldset>
  <fieldset><legend>Regional weather</legend><label class="setting">Chart<select id="systems"><option value="terrain">Terrain &amp; clouds</option><option value="composite">Weather systems</option><option value="low">Low cloud</option><option value="mid">Middle cloud</option><option value="high">High cloud</option><option value="pressure">Pressure</option><option value="precip">Six-hour rain</option></select></label><small id="regional-time"></small></fieldset>
  <fieldset><legend>Sun and terrain</legend><div class="actions"><button id="sunset">Face sunset</button><button id="recenter">Orbit terrain</button></div><label class="solar">Solar time <output id="solar-at"></output><input type="range" id="minute" min="0" max="1439" value="720" aria-label="Solar time of day"></label><button class="quiet" id="solar-reset">Use weather hour</button><small id="solar-site"></small></fieldset>
  <details id="samples"><summary>Model cells &amp; airport report</summary><label class="setting">ICON cell<select id="cell"></select></label><p id="cell-report"></p><p id="airport"></p><small>ICON values represent a fixed model cell. VTCC observations come from Chiang Mai International Airport.</small></details>
  <small id="archive-info"></small><a class="credits" href="index.html#credits">Data &amp; imagery credits ↗</a>
</aside></main><noscript>The map needs JavaScript. The field guide also works without it.</noscript>
<script src="observatory/world-data.js"></script><script src="observatory/scales-data.js"></script><script src="observatory/crag-terrain.js"></script><script src="observatory/cloud-gpu.js"></script><script src="observatory/cloud-light.js"></script><script src="observatory/sun.js"></script><script src="observatory/province-clouds.js"></script><script src="observatory/world.js"></script><script src="observatory/rain-marks.js"></script><script src="observatory/house-pin.js"></script><script src="observatory/friends.js"></script>
</body></html>
